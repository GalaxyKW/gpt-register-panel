<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17333b">
  <title>gpt_register 账号管理</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">GR</div>
      <div>
        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> GPT REGISTER / SUB2API</p>
      <h1>账号管理</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="modeBadge" class="badge badge-neutral">只读模式</span>
      <button id="refreshButton" class="button button-primary" type="button"><span class="button-icon" aria-hidden="true">↻</span><span>刷新</span></button>
    </div>
  </header>

  <main class="page">
    <section id="notice" class="notice" hidden></section>

    <section id="jobPanel" class="job-panel" hidden aria-live="polite">
      <div class="job-mark" aria-hidden="true">↗</div>
      <div class="job-copy">
        <div class="job-heading"><strong id="jobTitle">任务</strong><span id="jobStatus" class="badge badge-neutral">-</span></div>
        <p id="jobMeta">-</p>
      </div>
    </section>

    <section class="metrics" aria-label="概览">
      <div class="metric"><span>来源 token</span><strong id="tokenCount">-</strong><small id="tokenDetail">-</small></div>
      <div class="metric"><span>Sub2API 账号</span><strong id="accountCount">-</strong><small id="accountDetail">-</small></div>
      <div class="metric"><span>差异项目</span><strong id="diffCount">-</strong><small id="diffDetail">-</small></div>
      <div class="metric"><span>最近读取</span><strong id="lastRead">-</strong><small>服务器时间</small></div>
    </section>

    <section class="toolbar" aria-label="筛选">
      <label class="search-field">
        <span>搜索账号、邮箱、手机号或身份</span>
        <input id="searchInput" type="search" placeholder="例如 free00001、邮箱或手机号">
      </label>
      <label>
        <span>状态</span>
        <select id="statusFilter"><option value="">全部状态</option></select>
      </label>
      <label>
        <span>Sub2API 可用性</span>
        <select id="availabilityFilter"><option value="">全部</option></select>
      </label>
      <label>
        <span>来源</span>
        <select id="sourceFilter">
          <option value="">全部来源</option>
          <option value="tokens">tokens</option>
          <option value="use_token">use_token</option>
          <option value="sub2api">Sub2API</option>
        </select>
      </label>
      <label>
        <span>差异</span>
        <select id="diffFilter"><option value="">全部差异</option></select>
      </label>
      <label class="test-model-field">
        <span>账号测试模型</span>
        <select id="accountTestModelSelect">
          <option value="gpt-5.6-luna">5.6-luna</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
          <option value="gpt-5.6-sol">gpt-5.6-sol</option>
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="gpt-5.4-mini">gpt-5.4-mini</option>
        </select>
      </label>
      <div class="toolbar-actions">
        <label class="toolbar-check"><input id="historicalToggle" type="checkbox"><span>显示历史备份</span></label>
        <span id="selectionCount" class="selection-count">已选 0</span>
        <details class="column-picker">
          <summary><span class="button-icon" aria-hidden="true">☷</span><span>列</span></summary>
          <label><input type="checkbox" data-column-toggle="historical" checked> 历史累计</label>
          <label><input type="checkbox" data-column-toggle="current" checked> 本周期</label>
        </details>
        <button id="clearSelectionButton" class="button button-secondary" type="button"><span class="button-icon" aria-hidden="true">×</span><span>清除选择</span></button>
        <button id="previewButton" class="button button-secondary" type="button"><span class="button-icon" aria-hidden="true">⌁</span><span>检查差异</span></button>
        <button id="importButton" class="button button-primary" type="button" disabled><span class="button-icon" aria-hidden="true">↑</span><span>确认导入</span></button>
        <button id="phase3Button" class="button button-secondary phase3-button" type="button" disabled title="按顺序提交所选账号的 Phase 3"><span class="button-icon" aria-hidden="true">↗</span><span>Phase 3 批量</span></button>
        <button id="accountTestButton" class="button button-secondary account-test-button" type="button" disabled title="测试已选的上游账号"><span class="button-icon" aria-hidden="true">✓</span><span>测试选中账号</span></button>
        <button id="cleanupButton" class="button button-danger" type="button" disabled title="删除 tokens 和 use_token 中已过期的 JSON 文件"><span class="button-icon" aria-hidden="true">⌫</span><span>清理过期 token</span></button>
      </div>
    </section>

    <section id="planPanel" class="plan-panel" hidden>
      <div class="section-heading">
        <div>
          <h2>导入预览</h2>
          <p id="planSummary">-</p>
        </div>
        <span id="planVersion" class="loading-label"></span>
      </div>
      <div class="plan-wrap"><table><thead><tr><th>动作</th><th>账号</th><th>邮箱</th><th>来源</th><th>指纹</th><th>原因</th></tr></thead><tbody id="planRows"></tbody></table></div>
    </section>

    <section class="table-section">
      <div class="section-heading">
        <div>
          <h2>账号差异明细</h2>
          <p id="tableSummary">正在读取...</p>
        </div>
        <span id="loadingLabel" class="loading-label" hidden>读取中</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check-col"><input id="selectAll" type="checkbox" aria-label="选择当前列表"></th>
              <th>账号 / 文件</th>
              <th>邮箱对比</th>
              <th>强身份对比</th>
              <th>状态</th>
              <th>来源</th>
              <th>差异 / 同步决策</th>
              <th>过期时间对比</th>
              <th>Token 指纹对比</th>
              <th class="col-historical">历史累计</th>
              <th class="col-current">本周期</th>
            </tr>
          </thead>
          <tbody id="accountRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" hidden>没有符合筛选条件的账号</div>
    </section>
  </main>

  <dialog id="adminTokenDialog" class="auth-dialog" aria-labelledby="adminTokenTitle" aria-describedby="adminTokenHelp">
    <form method="dialog" class="auth-dialog-form">
      <div class="auth-dialog-heading">
        <span class="auth-dialog-mark" aria-hidden="true"></span>
        <div>
          <h2 id="adminTokenTitle">需要管理员令牌</h2>
          <p id="adminTokenHelp">令牌仅发送到当前面板 <code id="adminTokenOrigin"></code>，关闭后不会保留在输入框中。</p>
        </div>
      </div>
      <label class="auth-dialog-field" for="adminTokenInput">
        <span>面板管理员令牌</span>
        <input id="adminTokenInput" name="panel-token" type="password" autocomplete="current-password" spellcheck="false" maxlength="4096" required>
      </label>
      <div class="auth-dialog-actions">
        <button class="button button-secondary" type="submit" value="cancel" formnovalidate>取消</button>
        <button class="button button-primary" type="submit" value="confirm">验证并重试</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
